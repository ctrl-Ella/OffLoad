name: Tarea técnica
description: Trabajo interno sin cara visible - configuración, dependencias, CI, documentación
title: "[area] "
labels: ["tipo:tarea"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - devops
        - backend
        - frontend
        - ia
        - video
        - qa
        - docs
    validations:
      required: true

  - type: textarea
    id: que-hay-que-hacer
    attributes:
      label: Qué hay que hacer
    validations:
      required: true

  - type: textarea
    id: por-que
    attributes:
      label: Por qué
      description: |
        Qué mejora o qué problema evita. Una tarea técnica sin porqué acaba
        siendo trabajo que nadie echa de menos si no se hace.
    validations:
      required: true

  - type: textarea
    id: hecho
    attributes:
      label: Cuándo está hecha
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad
      options:
        - alta
        - media
        - baja
    validations:
      required: true
