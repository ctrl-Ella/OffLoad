name: Error
description: Algo que ya existe y no funciona
title: "[area] "
labels: ["tipo:bug"]
body:
  - type: markdown
    attributes:
      value: |
        "No va el vídeo" no se puede arreglar.
        "Al entrar en la sala con Firefox la cámara se queda en negro y la consola dice X" sí.

  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - frontend
        - backend
        - ia
        - video
        - devops
        - qa
        - docs
    validations:
      required: true

  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Lo que ocurre, tal cual
    validations:
      required: true

  - type: textarea
    id: que-deberia
    attributes:
      label: Qué debería pasar
    validations:
      required: true

  - type: textarea
    id: reproducir
    attributes:
      label: Cómo reproducirlo
      description: Los pasos exactos. Quien lo arregle va a seguirlos tal cual.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: entorno
    attributes:
      label: Dónde ocurre
      description: Navegador, sistema operativo, si es en Docker o en local
      placeholder: |
        Navegador: Firefox 141
        Sistema: Windows 11
        Ejecutando: npm run dev (no Docker)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Errores de consola o terminal
      description: |
        Pega el error completo, no solo la última línea.
        **Revisa que no lleve claves ni tokens antes de pegarlo: el repositorio es público.**
      render: shell
    validations:
      required: false

  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad
      description: ¿Bloquea a alguien ahora mismo?
      options:
        - alta
        - media
        - baja
    validations:
      required: true
