# Cierra las issues referenciadas en una pull request al mezclarse en `dev`.
#
# POR QUÉ EXISTE ESTE FICHERO
# GitHub solo interpreta `closes #12` cuando la pull request apunta a la rama
# por defecto del repositorio. La nuestra es `main`, pero todo el trabajo entra
# por `dev`: sin esto, ninguna issue se cerraría sola y las estaríamos cerrando
# a mano toda la hackatón sin entender por qué.
#
# Explicado en docs/WORKFLOW.md

name: Cerrar issues al mezclar en dev

on:
  pull_request_target:
    types: [closed]
    branches: [dev]

# Permisos mínimos: solo escribir en issues. Nada de contents: write.
permissions:
  issues: write

jobs:
  cerrar:
    # Cerrada sin mezclar no cuenta: descartar una pull request no resuelve la issue.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Cerrar las issues mencionadas
        uses: actions/github-script@v7
        with:
          script: |
            const cuerpo = context.payload.pull_request.body || '';
            const numeroPr = context.payload.pull_request.number;
            const autor = context.payload.pull_request.user.login;

            // Las mismas palabras clave que usa GitHub, para que nadie tenga
            // que aprender una sintaxis distinta de la habitual.
            const patron = /\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)/gi;

            const numeros = new Set();
            for (const coincidencia of cuerpo.matchAll(patron)) {
              numeros.add(Number(coincidencia[3]));
            }

            if (numeros.size === 0) {
              core.notice(
                `La pull request #${numeroPr} no menciona ninguna issue con ` +
                `"closes #NN". No hay nada que cerrar.`
              );
              return;
            }

            for (const numero of numeros) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  ...context.repo,
                  issue_number: numero,
                });

                if (issue.state === 'closed') {
                  core.info(`La issue #${numero} ya estaba cerrada.`);
                  continue;
                }

                // Comentario antes de cerrar: quien abrió la issue se entera de
                // qué la resolvió sin tener que buscarlo.
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: numero,
                  body:
                    `Resuelta por la pull request #${numeroPr} ` +
                    `(autoría de @${autor}), ya integrada en \`dev\`.`,
                });

                await github.rest.issues.update({
                  ...context.repo,
                  issue_number: numero,
                  state: 'closed',
                  state_reason: 'completed',
                });

                core.info(`Issue #${numero} cerrada.`);
              } catch (error) {
                // Una issue que no existe no debe tumbar el workflow: puede ser
                // una errata en el número y el resto sí hay que cerrarlas.
                core.warning(
                  `No se pudo cerrar la issue #${numero}: ${error.message}`
                );
              }
            }
