# Project labels. Single source of truth: applied by scripts/configurar-github.sh
#
# Created once and reused always. If everyone makes their own on the fly, within
# two days there is "bug", "Bug", "bugs" and "error", and no filter is any use.
#
# To add one: edit it here and run the script again.

# --- Area: who picks it up ---------------------------------------------------
- name: "area:frontend"
  color: "1f6feb"
  description: "Interface, components, styles"

- name: "area:backend"
  color: "0969da"
  description: "Route handlers, database, server logic"

- name: "area:ia"
  color: "8250df"
  description: "Agent, Mastra, Nebius, prompts"

- name: "area:video"
  color: "bf3989"
  description: "Vonage Video API, rooms, signalling"

- name: "area:devops"
  color: "6e7781"
  description: "Docker, CI, deployment, configuration"

- name: "area:qa"
  color: "bf8700"
  description: "Testing, verification, accessibility"

- name: "area:docs"
  color: "0e8a16"
  description: "Documentation and specs"

# --- Type: what kind of work it is -------------------------------------------
- name: "type:feature"
  color: "a2eeef"
  description: "Something new"

- name: "type:bug"
  color: "d73a4a"
  description: "Something that exists and does not work"

- name: "type:task"
  color: "d4c5f9"
  description: "Technical work with no visible face"

- name: "type:spec"
  color: "c5def5"
  description: "Writing or reviewing a spec"

# --- Priority: what comes first ----------------------------------------------
- name: "priority:high"
  color: "b60205"
  description: "Blocking someone, or blocking the delivery"

- name: "priority:medium"
  color: "fbca04"
  description: "Important, not urgent"

- name: "priority:low"
  color: "c2e0c6"
  description: "If there is time"

# --- Status: why it is not moving --------------------------------------------
- name: "status:blocked"
  color: "000000"
  description: "Waiting on something external. Say in a comment what you are waiting for"

- name: "status:in-review"
  color: "fef2c0"
  description: "Pull request open, waiting for review"

# --- Other -------------------------------------------------------------------
- name: "good-first-task"
  color: "7057ff"
  description: "Scoped, with enough context to start here"
