# Etiquetas del proyecto. Fuente única: se aplican con scripts/configurar-github.sh
#
# Se crean una vez y se reutilizan siempre. Si cada una crea las suyas sobre la
# marcha, en dos días hay "bug", "Bug", "bugs" y "error", y ningún filtro sirve.
